<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#3b2719" />
  <title>Visual Library – bản thử 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d140d; font-family: "EB Garamond", Georgia, serif; color: #ecdcb8; }
    #scene { position: fixed; inset: 0; touch-action: none; }
    #scene canvas { display: block; }
    #bar { position: fixed; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
      background: linear-gradient(rgb(59 39 25 / 0.92), rgb(42 27 16 / 0.92)); border-bottom: 1px solid rgb(184 144 63 / 0.55); z-index: 2; }
    #bar .brand { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 25px; letter-spacing: 0.5px; }
    #bar .where { color: #c9b48f; font-size: 16px; }
    #bar .grow { flex: 1; }
    button { font: inherit; font-size: 16px; color: #ecdcb8; background: transparent; border: 1px solid rgb(236 220 184 / 0.3); border-radius: 8px; padding: 7px 13px; min-height: 40px; cursor: pointer; }
    #panel { position: fixed; right: 18px; bottom: 18px; width: 330px; background: #f8f1df; color: #2a1f16; border-radius: 10px; padding: 16px 18px; z-index: 2;
      box-shadow: 0 0 0 1px rgb(184 144 63 / 0.6), 0 18px 40px rgb(0 0 0 / 0.45); outline: 1px solid rgb(184 144 63 / 0.35); outline-offset: -7px; }
    #panel .k { font-family: "Cormorant Garamond", serif; font-weight: 700; color: #a8792c; letter-spacing: 1.5px; font-size: 14px; }
    #panel .t { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 26px; line-height: 1.15; margin-top: 4px; }
    #panel .a { font-style: italic; color: #6b5843; }
    #panel .row { display: flex; gap: 8px; margin-top: 14px; }
    #panel button { color: #2a1f16; border-color: #d3c09a; }
    #panel button.p { flex: 1; background: #2f4a3c; color: #f3ead2; border-color: #8a7a45; }
    #panel .desk-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed #d3c09a; }
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #2a1b10; border: 1px solid rgb(184 144 63 / 0.5); padding: 10px 16px; border-radius: 8px; z-index: 3; }
    #hint { position: fixed; left: 18px; bottom: 16px; font-size: 15px; color: #c9b48f; z-index: 1; text-shadow: 0 1px 3px #000; }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="bar"></div>
  <div id="panel" hidden></div>
  <div id="toast" hidden></div>
  <div id="hint">Chạm vào tủ sách, bàn học hoặc bảng ghim · Trong lối đi: vuốt ngang để lướt kệ, chạm gáy để rút sách</div>
  <script type="module" src="/src/proto3d/main.ts"></script>
</body>
</html>
